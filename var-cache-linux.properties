# var-cache-linux.properties
# Top-level /var/cache subdirectories that are safe to empty.
# The script removes only the *contents* of each listed directory;
# the directory itself and its permissions/ownership are preserved.
#
# APT/DNF, BIND, debconf, /var/cache/private, and other special or
# package-manager caches are intentionally omitted. APT/DNF caches are
# cleaned by their native commands (apt-get clean / dnf clean all);
# BIND, debconf, and private are left untouched.

man
fontconfig
cups
cracklib
dictionaries-common
ldconfig
apparmor
app-info
fwupd
fwupdmgr
